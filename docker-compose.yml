services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/docs:/app/data/docs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: sh -c 'celery -A tasks.celery_app worker --loglevel="$${LOG_LEVEL:-INFO}" --concurrency="$${CELERY_WORKER_CONCURRENCY:-1}"'
    env_file:
      - .env
    volumes:
      - ./data/docs:/app/data/docs
