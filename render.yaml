services:
  - type: web
    name: forest-rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_DIMENSIONS
        value: 768
      - key: TOP_K
        value: 3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: 1440
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 30
      - key: AUTH_DISABLED
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: VALIDATE_CONFIG_ON_STARTUP
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_UPLOAD_EXTENSIONS
        value: pdf,txt,docx,ppt,pptx
      - key: UPLOAD_MAX_BYTES
        value: 157286400
      - key: UPLOAD_BATCH_MAX_BYTES
        value: 157286400
      - key: UPLOAD_BATCH_MAX_FILES
        value: 50
      - key: ALLOW_DOCUMENT_REPLACE
        value: false
      - key: DOCUMENT_STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PREFIX
        value: docs/
      - key: CHUNK_TOKENS
        value: 600
      - key: CHUNK_OVERLAP_TOKENS
        value: 100
      - key: MAX_UNIT_TOKENS
        value: 220
      - key: FAQ_CHUNK_TOKENS
        value: 650
      - key: FAQ_CHUNK_OVERLAP_TOKENS
        value: 80
      - key: FAQ_UNIT_TOKENS
        value: 260
      - key: PROCEDURE_CHUNK_TOKENS
        value: 720
      - key: PROCEDURE_CHUNK_OVERLAP_TOKENS
        value: 160
      - key: PROCEDURE_UNIT_TOKENS
        value: 260
      - key: PDF_EXTRACT_TABLES
        value: false
      - key: DOCUMENT_AI_OCR_ENABLED
        value: true
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/document-ai-credentials.json
      - key: GOOGLE_CLOUD_PROJECT
        value: gen-lang-client-0687293421
      - key: DOCUMENT_AI_LOCATION
        value: asia-south1
      - key: DOCUMENT_AI_PROCESSOR_ID
        value: ed7664de7f2567dc
      - key: DOCUMENT_AI_OCR_LANGUAGE_HINTS
        value: en,hi
      - key: DOCUMENT_AI_OCR_MIN_TEXT_CHARS
        value: 40
      - key: DOCUMENT_AI_OCR_MAX_PAGES
        value: 200
      - key: DOCUMENT_AI_OCR_TIMEOUT_SECONDS
        value: 60
      - key: DOCUMENT_AI_OCR_RETRY_ATTEMPTS
        value: 3
      - key: DOCUMENT_AI_OCR_MAX_REQUEST_BYTES
        value: 40000000
      - key: MAX_PDF_PAGES
        value: 500
      - key: MAX_EXTRACTED_CHARS
        value: 15000000
      - key: MAX_DOCUMENT_CHUNKS
        value: 3000
      - key: INGEST_BATCH_SIZE
        value: 24
      - key: RAG_INDEX_VERSION
        value: 3
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_VISIBILITY_TIMEOUT_SECONDS
        value: 3600
      - key: CELERY_TASK_MAX_RETRIES
        value: 3
      - key: CELERY_TASK_RETRY_BASE_SECONDS
        value: 60
      - key: CELERY_REQUIRE_WORKER_ONLINE
        value: true
      - key: CELERY_WORKER_PING_TIMEOUT_SECONDS
        value: 2
